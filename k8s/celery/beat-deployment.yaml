# IMPORTANT: replicas MUST stay at 1. Multiple beat instances cause duplicate task scheduling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: my-garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: beat
          image: ghcr.io/zaigner/my-garage:latest  # Replace OWNER with your GitHub username
          command:
            - celery
            - -A
            - config.celery_app
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - secretRef:
                name: my-garage-secrets
            - configMapRef:
                name: my-garage-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
