# IMPORTANT: replicas MUST stay at 1. Multiple beat instances cause duplicate task scheduling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: my-garage
spec:
  replicas: 1
  # replicas: 1 alone does not guarantee a single scheduler. The default
  # RollingUpdate surges a second pod before retiring the first, so every
  # deploy briefly ran two beats — double-firing scheduled tasks, which is
  # exactly what the warning above forbids. Recreate terminates the old pod
  # first. Beat schedules work rather than serving traffic, so the momentary
  # gap costs nothing.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      # Beat only needs to flush its scheduler state; it runs no tasks itself.
      terminationGracePeriodSeconds: 30
      containers:
        - name: beat
          image: ghcr.io/zaigner/my-garage:latest  # Replace OWNER with your GitHub username
          command:
            - celery
            - -A
            - config.celery_app
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - secretRef:
                name: my-garage-secrets
            - configMapRef:
                name: my-garage-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
