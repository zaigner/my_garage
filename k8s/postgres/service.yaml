# Headless service — StatefulSet pods get stable DNS: postgres-0.postgres.my-garage.svc.cluster.local
# Django connects via DB_HOST=postgres (resolves to pod IP via headless DNS).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: my-garage
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
