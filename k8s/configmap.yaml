# Non-secret environment variables shared across all my-garage services.
# Apply with: kubectl apply -f k8s/configmap.yaml
# Service hostnames use K8s internal DNS: <service-name> resolves within the namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-garage-config
  namespace: my-garage
data:
  DJANGO_SETTINGS_MODULE: config.settings.production
  # The Traefik LoadBalancer address is listed so the app is reachable without a
  # DNS entry. Django returns 400 DisallowedHost for any Host not in this list.
  # my-garage.zachelorpad.com is the public hostname reached via the Cloudflare
  # Tunnel (k8s/django/ingress.yaml).
  ALLOWED_HOSTS: my-garage.local,192.168.50.200,my-garage.zachelorpad.com
  # False because the Cloudflare Tunnel hop to Traefik for my-garage.zachelorpad.com
  # is plain HTTP (Cloudflare Access already terminated TLS at the edge) -- with the
  # default True, Django would see that internal http hop and try to force a
  # redirect to https, which 404s the same way plain `web`-only routing does for
  # my-garage.local (k8s/django/ingress.yaml's comment). SESSION_COOKIE_SECURE and
  # CSRF_COOKIE_SECURE stay True regardless (production.py), so this only affects
  # the redirect, not cookie security.
  SECURE_SSL_REDIRECT: "False"

  # PostgreSQL
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: my_garage
  DB_USER: postgres

  # Redis (Celery broker + result backend)
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

  # MongoDB
  MONGO_URI: mongodb://mongodb:27017/
  MONGO_DB_NAME: my_garage_docs

  # Internal service URL (Django → FastAPI)
  FASTAPI_BASE_URL: http://fastapi:8001
