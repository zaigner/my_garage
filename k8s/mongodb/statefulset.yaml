apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: my-garage
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ReadWriteOnce]
        # local-path, NOT nfs-client. MongoDB's WiredTiger engine requires POSIX
        # locking and write-ordering guarantees that NFS does not provide; running
        # on the NAS corrupted this volume's metadata (2026-08-14, after ~8k crash
        # restarts). Single-replica StatefulSet gains nothing from network storage.
        # Trade-off: the data is pinned to whichever node first schedules the pod.
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
