apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: my-garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          # Same image as Django — CMD override runs FastAPI instead
          image: ghcr.io/zaigner/my-garage:latest  # Replace OWNER with your GitHub username
          command: ["uvicorn", "fastapi_services.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]
          envFrom:
            - secretRef:
                name: my-garage-secrets
            - configMapRef:
                name: my-garage-config
          ports:
            - containerPort: 8001
          # This container overrides `command`, which replaces the image's
          # ENTRYPOINT — so it skips entrypoint.sh and never runs migrations.
          # It still needs a startup budget for uvicorn boot. Two minutes was
          # not enough on a node still busy unpacking a freshly pulled image:
          # the container was killed and restarted twice before it could bind.
          # Budget: 30 x 10s = 5 minutes, matching Django.
          startupProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Previously absent: a wedged FastAPI process was never restarted.
          livenessProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
