[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-garage"
version = "0.1.0"
description = "Automotive asset management and valuation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2.11,<5.3",
    "djangorestframework>=3.14,<4.0",
    "django-cors-headers>=4.0,<5.0",
    "django-debug-toolbar>=4.2,<5.0",
    "fastapi>=0.104,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "requests>=2.33.0,<3.0",
    "pydantic>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "pillow>=12.1.1,<13.0",
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "beautifulsoup4>=4.12,<5.0",
    "pytesseract>=0.3,<0.4",
    "python-multipart>=0.0.22,<0.1.0",
    "whitenoise>=6.6,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.0",
    "pytest-django>=4.5,<5.0",
    "pytest-cov>=4.1,<5.0",
    "factory-boy>=3.3,<4.0",
    "faker>=19.0,<20.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["config*", "my_garage*", "fastapi_services*"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[tool.pixi.tasks]
migrate = "python manage.py migrate"
server = "python manage.py runserver"
worker = "celery -A config.celery_app worker -l info"
fastapi = "uvicorn src.fastapi_services.main:app --host 0.0.0.0 --port 8001 --reload"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*.py" = ["F403", "F405"]
"src/my_garage/migrations/*.py" = ["E501"]
"src/my_garage/skills/theme_generator.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["config", "my_garage", "fastapi_services"]
