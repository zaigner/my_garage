<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{% block title %}Estate Portal{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'luxury-black': '#0B1026',
                        'luxury-card': '#151b33',
                        'luxury-gold': '#D4AF37',
                        'luxury-white': '#F5F5F5',
                        'luxury-text': '#A3A3A3',
                    },
                    fontFamily: {
                        'script': ['"Pinyon Script"', 'cursive'],
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-luxury-black text-luxury-white font-sans min-h-screen">
    <main class="{% block main_width %}max-w-xl{% endblock %} mx-auto px-4 sm:px-6 py-10">
        {% if messages %}
        <div class="space-y-2 mb-6">
            {% for message in messages %}
            {% if message.level_tag == "error" %}
            <div role="alert" class="bg-red-900/40 border border-red-400/60 text-red-100 text-sm rounded-md px-4 py-3">{{ message }}</div>
            {% else %}
            <div role="status" class="bg-luxury-card border border-white/20 text-gray-200 text-sm rounded-md px-4 py-3">{{ message }}</div>
            {% endif %}
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
