{% extends "base.html" %}

{% block title %}Delete {{ item.name }}?{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Confirm Deletion</h1>

        <p class="text-gray-700 mb-6">
            Are you sure you want to delete <strong>{{ item.name }}</strong> from {{ collection_type.name }}?
            This action cannot be undone.
        </p>

        <form method="post" class="flex gap-4">
            {% csrf_token %}
            <button type="submit"
                    class="bg-red-500 text-white px-6 py-2 rounded-md hover:bg-red-600">
                Yes, Delete
            </button>
            <a href="{% url 'collections:collection_item_detail' collection_type.slug item.id %}"
               class="bg-gray-200 text-gray-700 px-6 py-2 rounded-md hover:bg-gray-300">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
