{% extends "my_garage/base.html" %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-md">
    <div class="bg-white p-6 rounded-lg shadow-lg border border-red-200">
        <h1 class="text-2xl font-bold text-red-600 mb-4">Confirm Deletion</h1>
        <p class="text-gray-700 mb-6">
            Are you sure you want to delete this {{ type }}?
            <br>
            <span class="font-semibold">{{ object }}</span>
        </p>
        <p class="text-sm text-gray-500 mb-6">This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <div class="flex justify-end space-x-4">
                <a href="{{ cancel_url }}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-bold">Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
