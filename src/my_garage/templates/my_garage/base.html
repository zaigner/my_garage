{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Garage{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'garage-wall': '#2C2C2C',
                        'garage-floor': '#0a0a0a',
                        'luxury-black': '#0B1026',
                        'luxury-card': '#151b33',
                        'luxury-gold': '#D4AF37',
                        'luxury-gold-dim': '#8a7020',
                        'luxury-red': '#8B0000',
                        'luxury-white': '#F5F5F5',
                        'luxury-text': '#A3A3A3',
                    },
                    fontFamily: {
                        'script': ['"Pinyon Script"', 'cursive'],
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-luxury-black text-luxury-white font-sans">

    {% include "includes/_nav.html" %}

    <main>
        {% if messages %}
            <div class="container mx-auto mt-4 px-4">
                {% for message in messages %}
                    <div class="p-4 mb-4 text-sm text-white rounded-lg {% if message.tags == 'success' %}bg-green-600{% elif message.tags == 'error' %}bg-red-600{% else %}bg-blue-600{% endif %} shadow-lg" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
