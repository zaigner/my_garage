{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Garage{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'garage-wall': '#2C2C2C',
                        'garage-floor': '#0a0a0a',
                        'luxury-black': '#0B1026',
                        'luxury-card': '#151b33',
                        'luxury-gold': '#D4AF37',
                        'luxury-gold-dim': '#8a7020',
                        'luxury-red': '#8B0000',
                        'luxury-white': '#F5F5F5',
                        'luxury-text': '#A3A3A3',
                    },
                    fontFamily: {
                        'script': ['"Pinyon Script"', 'cursive'],
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-luxury-black text-luxury-white font-sans">

    {% include "includes/_nav.html" %}

    <main>
        {% if messages %}
            <div class="container mx-auto mt-4 px-4">
                {% for message in messages %}
                    <div x-data="{ show: true }"
                         x-show="show"
                         x-transition:leave="transition ease-in duration-300"
                         x-transition:leave-start="opacity-100 translate-y-0"
                         x-transition:leave-end="opacity-0 -translate-y-2"
                         {% if message.tags == 'success' %}x-init="setTimeout(() => show = false, 4000)"{% endif %}
                         class="flex items-center justify-between p-4 mb-4 text-sm text-white rounded-lg {% if message.tags == 'success' %}bg-green-600{% elif message.tags == 'error' %}bg-red-600{% else %}bg-blue-600{% endif %} shadow-lg"
                         role="alert">
                        <span>{{ message }}</span>
                        <button @click="show = false"
                                class="ml-4 text-white/70 hover:text-white transition-colors flex-shrink-0"
                                aria-label="Dismiss">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
