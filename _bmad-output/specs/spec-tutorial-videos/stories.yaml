- id: "1"
  title: Fix the welcome checklist step-2 link
  description: >-
    Point the step-2 "View →" link on /welcome/ at a collection holding one
    of the guest's items instead of the hard-coded automobiles slug (CAP-1;
    brownfield.md "Defect").
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    The onboarding view is in src/config/views.py, not my_garage/views.py.
    Regression test: a guest with only Wine Collection and one item gets 200
    from every checklist link.
- id: "2"
  title: Recorder harness, embed partial and Video 1
  description: >-
    Build `pixi run record-tutorials` end to end (seeded throwaway DB, cursor
    and caption overlays, MP4 + poster output) and the shared embed partial,
    then record and embed Video 1 on /welcome/ and /collections/templates/
    (CAP-2, CAP-5, CAP-6 in part; recording-pipeline.md). Includes
    per-video re-recording (`record-tutorials video1`) and the 6 MB
    combined-size check.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Commit the recorded MP4 and poster in the same PR as the embeds.
    Playwright and ffmpeg go in feature.dev only; confirm the prod env lock
    is unchanged. Record Video 1's size and the encoder settings used in
    the story's Implementation Notes; if it can't fit about 2 MB with
    legible captions, ask the owner before changing the budget.
- id: "3"
  title: Desktop variant for tutorial videos
  description: >-
    Give the recorder a desktop profile alongside the phone one, re-record
    Video 1 in both variants, and make the embed partial pick the variant by
    viewport width (768px) when Play is pressed, with a CSS-toggled thumbnail
    and a wider desktop player (CAP-7, CAP-5, CAP-6; recording-pipeline.md
    "Capture" and "Variant selection"). Phone files keep their names;
    desktop files are videoN-desktop.mp4/.jpg.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Settle the desktop viewport by checking frames at the real /welcome/
    player width (about 620px); start near 880x550 and stay at or above
    768px wide. Video 1's phone flow opens the hamburger, which the desktop
    nav doesn't have, so branch that step on the variant. Record the
    desktop variant's size and encoder settings in Implementation Notes.
    The static-reference test must cover both new files on both pages.
    The owner checks playback on a laptop and an iPhone.
- id: "4"
  title: "Video 2: your first item"
  description: >-
    Script, record and embed Video 2, in both variants, in the collection
    list empty state, absent once the collection has an item (CAP-3, CAP-7).
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Reuse the harness, caption helpers and variant profiles from Stories 2
    and 3. The photo fixture must already be upright (no EXIF rotation), so
    frames match across runs.
- id: "5"
  title: "Video 3: build a collection for anything"
  description: >-
    Script, record and embed Video 3, in both variants, on
    /collections/create/ in create mode only, with the generate-schema
    request intercepted; then verify full CAP-6 and CAP-7 acceptance across
    all three videos (CAP-4, CAP-6, CAP-7).
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Fail the run if the generate-schema route interception isn't hit. Prove
    determinism by running record-tutorials twice and comparing.
