name: Security Scan

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3 AM UTC
  push:
    paths:
      - 'pixi.toml'
      - 'pixi.lock'
      - 'pyproject.toml'
  workflow_dispatch:  # Allow manual runs

jobs:
  scan:
    name: Dependency & Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required to upload SARIF results

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e  # v0.9.4
        with:
          pixi-version: latest

      # Fail fast if pixi.lock is out of sync with pixi.toml
      - name: Verify lock file integrity
        run: pixi install --locked

      # Scan PyPI and conda packages against OSV database
      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5  # v2.3.5
        with:
          scan-args: |-
            --lockfile=pixi.lock
            --lockfile=pyproject.toml
        continue-on-error: true  # Report findings without blocking

      # Scan PyPI packages specifically via PyPA advisory database
      - name: pip-audit
        run: pixi run pip-audit --desc on 2>&1 || true

      # Grype for comprehensive CVE scanning (Trivy replacement)
      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Grype vulnerability scan
        run: grype dir:. --severity high --output table
        continue-on-error: true

      # Generate SBOM with Syft
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: syft dir:. -o cyclonedx-json > sbom-${{ github.run_id }}.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-${{ github.run_id }}
          path: sbom-${{ github.run_id }}.json
          retention-days: 90
