name: Deploy to K3s

# Triggers after a successful Build workflow run on main.
# Flow: CI (ci.yml) → Build (build.yml) → Deploy (this file)
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to K3s Homelab
    # Runs on the self-hosted runner inside the cluster (see k8s/ci/).
    #
    # GitHub-hosted runners cannot do this job: aignerpi-2 is on 192.168.50.0/24,
    # a private network with no inbound route from GitHub's cloud. The previous
    # version of this workflow SSHed to that address from ubuntu-latest and could
    # never have connected.
    #
    # The runner polls GitHub outbound, so no firewall rule, no port forwarding
    # and no SSH key in GitHub secrets. It authenticates to the cluster with its
    # ServiceAccount token, scoped by k8s/ci/rbac.yaml to patching my-garage
    # Deployments and nothing else.
    runs-on: [self-hosted, k3s]
    # Only deploy if the Build workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Deploy the manifests from the same commit the image was built from.
      # github.sha would be the tip of main, which may have moved on since the
      # Build workflow started — that would pair new manifests with an old image.
      - name: Check out the commit that was built
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve image tag
        id: tag
        run: |
          # Use the short SHA of the commit that triggered the Build workflow
          echo "sha=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Pin image tag in kustomization
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.sha }}"

          # The committed placeholder is `latest`; point it at this build.
          sed -i "s|^\( *\)newTag: .*|\1newTag: ${TAG}|" k8s/kustomization.yaml

          # Fail loudly rather than deploying `latest` if the sed ever misses,
          # which would silently ship whatever `latest` happened to point at.
          grep -q "newTag: ${TAG}" k8s/kustomization.yaml \
            || { echo "::error::failed to pin image tag ${TAG}"; exit 1; }

          echo "Deploying manifests at tag ${TAG}:"
          kubectl kustomize k8s | grep -E "^\s+image:|^  name:"

      - name: Show what will change
        # Informational only. `kubectl diff` needs dry-run create rights the
        # runner's Role does not grant, so a failure here must not fail the job.
        continue-on-error: true
        run: kubectl diff -k k8s || true

      - name: Apply manifests
        run: |
          set -euo pipefail

          # Server-side apply. The previous pipeline set the image imperatively
          # with `kubectl set image`, leaving that field owned by a different
          # field manager; --force-conflicts transfers ownership to this apply.
          # It can be dropped once every Deployment has been applied this way.
          kubectl apply -k k8s --server-side --force-conflicts

      - name: Wait for rollouts
        run: |
          set -euo pipefail

          # Every workload, not just Django — a crash-looping worker used to
          # sail through as a green deploy.
          # Image pulls on a Pi are slow; 120s was not enough in practice.
          for deployment in django fastapi celery-worker celery-beat; do
            echo "── waiting for ${deployment}"
            kubectl rollout status "deployment/${deployment}" \
              -n my-garage --timeout=600s
          done

          echo "Deploy complete: ${{ steps.tag.outputs.sha }}"

      - name: Show pod state on failure
        if: failure()
        run: |
          kubectl get pods -n my-garage -o wide
          kubectl describe pods -n my-garage -l app=django | tail -40 || true
          for app in django fastapi celery-worker celery-beat; do
            echo "── logs: ${app}"
            kubectl logs -n my-garage -l "app=${app}" --tail=50 || true
          done
