name: Build

on:
  push:
    branches: [main]

# Only run after CI passes on the same commit
# Build is triggered separately (not via needs:) so it can be re-run independently.
# To gate on CI: change trigger to workflow_run (see deploy.yml for pattern).

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # Multi-platform support: linux/amd64 (CI runners) + linux/arm64 (Pi 5 nodes)
      # PREREQUISITE: linux-aarch64 must be in pixi.toml platforms + pixi.lock updated
      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Auto-provided, no setup needed

      # Generate image tags:
      #   ghcr.io/<owner>/my-garage:latest
      #   ghcr.io/<owner>/my-garage:<short-sha>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/my-garage
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the registry to speed up subsequent builds
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/my-garage:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/my-garage:buildcache,mode=max
