name: Build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Build-only check (nothing is pushed) for PRs that change what goes into
  # the image. Without it the first arm64 build of a Dockerfile or dependency
  # change happened on main, after merge.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - entrypoint.sh
      - pixi.toml
      - pixi.lock
      - .github/workflows/build.yml

jobs:
  build-and-push:
    name: Build & Push Docker Image
    # Native ARM64 runner. The cluster is all Raspberry Pi 5 (arm64), so that
    # is the only platform built. Building on x86 meant emulating arm64 under
    # QEMU, several times slower, and also producing an amd64 image that
    # nothing pulled.
    runs-on: ubuntu-24.04-arm
    # On main, only build if CI passed — prevents pushing broken images to GHCR
    if: ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    steps:
      - uses: actions/checkout@v6

      # PREREQUISITE: linux-aarch64 must be in pixi.toml platforms + pixi.lock updated
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Auto-provided, no setup needed

      # Generate image tags:
      #   ghcr.io/<owner>/my-garage:latest
      #   ghcr.io/<owner>/my-garage:<short-sha>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/my-garage
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the registry to speed up subsequent builds
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/my-garage:buildcache
          # PR builds read the cache but never write it
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/my-garage:buildcache,mode=max', github.repository_owner) || '' }}
